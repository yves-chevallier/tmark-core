[package]
name = "tmark-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TMark registries: counters, labels, citations and includes resolved from the IR"

[features]
# Off by default so that feature unification through tmark-lint and
# tmark-writers cannot switch it on for WASM; the facade turns it on.
default = []
# `FsLoader`: the one `Loader` that touches the file system.
fs = []

[dependencies]
# The IR the registries are built from.
tmark-ir = { path = "../tmark-ir", version = "0.3.0" }
# Included files are parsed here (design/06-registries.md §Includes).
tmark-syntax = { path = "../tmark-syntax", version = "0.3.0" }
# Inventories are JSON with a schema (design/06-registries.md §Inventory format).
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
# `.bib` files (design/06-registries.md §Load sources).
biblatex = "0.12"
