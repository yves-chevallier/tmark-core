[package]
name = "tmark"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TMark facade: parse, format, lint, resolve and write TeXSmith Markdown"

[features]
default = ["fs"]
fs = ["tmark-registry/fs"]

[dependencies]
# The facade re-exports one entry point per crate (design/01-architecture.md
# §The facade): IR and schemas, parser, registries (fs behind the feature),
# printer, lint rules, writers (milestone 4).
tmark-ir = { path = "../tmark-ir", version = "0.3.1" }
tmark-syntax = { path = "../tmark-syntax", version = "0.3.1" }
tmark-registry = { path = "../tmark-registry", version = "0.3.1", default-features = false }
tmark-fmt = { path = "../tmark-fmt", version = "0.3.1" }
tmark-lint = { path = "../tmark-lint", version = "0.3.1" }
tmark-writers = { path = "../tmark-writers", version = "0.3.1" }
# `tmark.toml` parsing (design/08-lsp.md §Workspace); no I/O here, the
# edges hand over the text (`Config::discover` is behind `fs`, like FsLoader).
toml = { workspace = true }
serde = { workspace = true }
# The versioned document JSON and the schemas the bindings serve
# (`to_json`, `schema("resolved")`, `schema_hash`; design/09-bindings.md).
serde_json = { workspace = true }
schemars = { workspace = true }
