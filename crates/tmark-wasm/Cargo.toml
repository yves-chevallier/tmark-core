[package]
name = "tmark-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TMark WebAssembly bindings (stub)"
# A three-line skeleton (design/11-roadmap.md M5 item 4); nothing to publish yet.
publish = false

[dependencies]
# The facade without `fs`: WASM has no file system (MemoryLoader only).
tmark = { path = "../tmark", version = "0.3.0", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]
