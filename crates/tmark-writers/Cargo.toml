[package]
name = "tmark-writers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TMark writers: IR to LaTeX, Typst and the Mkdocs web profile"

[dependencies]
# Writers read the IR...
tmark-ir = { path = "../tmark-ir", version = "0.3.0" }
# ...and the resolution (numbers, labels, citations); never the file system.
tmark-registry = { path = "../tmark-registry", version = "0.3.0", default-features = false }
# The web lowering (`mkdocs.rs`) splices its replacements through `edit_many`
# and prints untouched children in the `Mkdocs` profile (web-profile.md).
tmark-fmt = { path = "../tmark-fmt", version = "0.3.0" }
# `Body`, `Requires` and `SourceMap` cross to Python and to `tmark write --map`
# as JSON (design/07-writers.md, writers-and-passes.md §1).
serde = { workspace = true }
# `press.declare.acronyms` is a JSON map in the front matter (common/abbr.rs).
serde_json = { workspace = true }
# Typst labels take XID_Continue characters plus `_ - : .` (typst 0.15
# lexer): the exact predicate, so an accented or non-Latin heading id stays
# a label of its own instead of a run of dashes (typst/escape.rs).
unicode-ident = "1.0"

[dev-dependencies]
# Tests parse their inputs.
tmark-syntax = { path = "../tmark-syntax", version = "0.3.0" }
# One snapshot per conformance fixture and per backend (design/10-testing.md §4).
insta = { workspace = true }
