[package]
name = "tmark-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TMark canonical printer: IR back to TeXSmith Markdown text"

[dependencies]
# The IR is what the printer prints.
tmark-ir = { path = "../tmark-ir", version = "0.2.0" }

[dev-dependencies]
# Round-trip tests: parse(print(doc)) == doc.
tmark-syntax = { path = "../tmark-syntax", version = "0.2.0" }
# Scratch example and JSON dumps in tests.
serde_json = { workspace = true }
# Property tests: edit_many splices are the identity on canonical text.
proptest = { workspace = true }
# Snapshots of the Mkdocs profile over the fixture corpus.
insta = { workspace = true }
