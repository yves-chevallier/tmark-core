[package]
name = "tmark-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TMark command-line interface: parse, format, lint and write TeXSmith Markdown"

[[bin]]
name = "tmark"
path = "src/main.rs"

[dependencies]
tmark = { path = "../tmark", version = "0.3.1" }
# Command-line parsing; the edge crates may depend on it (design/01-architecture.md).
clap = { workspace = true }
# `tmark parse` and `tmark schema` print JSON.
serde_json = { workspace = true }
# `tmark lint --fix --diff` prints a unified diff (line LCS; already in the lock file).
diff = "0.1"
